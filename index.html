    const inputModelo = document.getElementById('modelo');
    const suggestionsBox = document.getElementById('suggestions');
    const btnSemDpi = document.getElementById('btn-sem-dpi');

    document.getElementById('androidBtn').onclick = () => { 
      os = 'Android'; 
      trocar('androidBtn','iosBtn'); 
      inputModelo.placeholder = "Ex: ROG Phone 8, RedMagic 9 Pro, Poco X8 Pro, Galaxy S25...";

      atualizarAutocomplete();

    function trocar(ativo, inativo) {
      document.getElementById(ativo).classList.add('bg-cyan-400','text-black');
      document.getElementById(ativo).classList.remove('text-gray-400');
      document.getElementById(inativo).classList.remove('bg-cyan-400','text-black');
      document.getElementById(inativo).classList.add('text-gray-400');
    }

    function atualizarAutocomplete() {
      const valor = inputModelo.value.toLowerCase().trim();
      suggestionsBox.innerHTML = '';

      if (!valor) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      const listaAtual = os === 'Android' ? aparelhosAndroid : aparelhosIOS;
      const filtrados = listaAtual.filter(item => item.toLowerCase().includes(valor));

      if (filtrados.length > 0) {
        filtrados.forEach(item => {
          const div = document.createElement('div');
          div.className = 'px-4 py-3 hover:bg-cyan-400 hover:text-black cursor-pointer font-bold border-b border-gray-700/50 last:border-0';
          div.innerText = item;
          div.onclick = function() {
            inputModelo.value = item;
            suggestionsBox.classList.add('hidden');
          };
          suggestionsBox.appendChild(div);
        });
        suggestionsBox.classList.remove('hidden');
      } else {
        suggestionsBox.classList.add('hidden');
      }
    }

    inputModelo.addEventListener('input', atualizarAutocomplete);

    document.addEventListener('click', function(e) {
      if (e.target !== inputModelo && e.target !== suggestionsBox) {
        suggestionsBox.classList.add('hidden');
      }
    });

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function randFloat(min, max, dec) { return parseFloat((Math.random() * (max - min) + min).toFixed(dec)); }
    function escolha(arr) { return arr[rand(0, arr.length-1)]; }

    function detectarHardware(modeloTxt) {
      const txt = modeloTxt.toLowerCase().trim();

      if (os === 'iOS' || txt.includes('iphone')) {
        if (txt.includes('pro')) {
          return {
            categoria: "iOS Pro Performance 🍎🚀",
            taxaHz: "ProMotion 120 Hz (Ajuste Automático do iOS)",
            respostaToque: "Otimizada de Alta Precisão"
          };
        } else {
          return {
            categoria: "iOS Padrão 🍎",
            taxaHz: "60 Hz (Padrão do Dispositivo iOS)",
            respostaToque: "Otimizada iOS"
          };
        }
      }
      
      if (
        txt.includes('a01') || txt.includes('a02') || txt.includes('a03') || txt.includes('a04') || txt.includes('a05') ||
        txt.includes('a10') || txt.includes('a11') || txt.includes('a12') || txt.includes('a13') || txt.includes('a14') || txt.includes('a16') ||
        txt.includes('a20') || txt.includes('a21') || txt.includes('moto e') || txt.includes('g10') || txt.includes('g14') || txt.includes('g20') || txt.includes('g22') || txt.includes('g24') ||
        txt.includes('10c') || txt.includes('9a') || txt.includes('9c') || txt.includes('8a') || txt.includes('7a') || txt.includes('14c') || txt.includes('13c') ||
        txt.includes('lg') || txt.includes('hot 10') || txt.includes('hot 11') || txt.includes('hot 12') || txt.includes('hot 20') || txt.includes('c11') || txt.includes('c21') || txt.includes('c30') || txt.includes('j4') || txt.includes('j5') || txt.includes('j7') || txt.includes('multilaser')

        return {
          categoria: "Linha de Entrada / Básico 📱",
          taxaHz: "60 Hz (Padrão do Celular)",
          respostaToque: "Normal"
        };
      }

      if (txt.includes('poco') || txt.includes('rog') || txt.includes('redmagic') || txt.includes('black shark') || txt.includes('ultra') || txt.includes('s22 ultra') || txt.includes('s23') || txt.includes('s24') || txt.includes('s25') || txt.includes('s26') || txt.includes('fe') || txt.includes('xiaomi 14') || txt.includes('xiaomi 15') || txt.includes('gt 20') || txt.includes('gt 30') || txt.includes('oneplus 1') || txt.includes('pixel 8') || txt.includes('pixel 9')) {
        return {
          categoria: "Alta Performance / Gamer 🚀",
          taxaHz: "120 Hz / 144 Hz (Ativar nas Configurações de Tela)",
          respostaToque: "Ultra Rápida (Ativada)"
        };
      }
      else if (txt.includes('redmi note') || txt.includes('moto g') || txt.includes('a32') || txt.includes('a33') || txt.includes('a34') || txt.includes('a35') || txt.includes('a36') || txt.includes('a37') || txt.includes('a52') || txt.includes('a53') || txt.includes('a54') || txt.includes('a55') || txt.includes('a56') || txt.includes('a57') || txt.includes('a73') || txt.includes('m34') || txt.includes('m35') || txt.includes('m54') || txt.includes('m55') || txt.includes('gt') || txt.includes('edge') || txt.includes('13t') || txt.includes('14t') || txt.includes('nord')) {
        return {
          categoria: "Performance Intermediária ⚡",
          taxaHz: "90 Hz / 120 Hz (Recomendado)",
          respostaToque: "Otimizada"
        };
      }
      else {
        return {
          categoria: "Linha Padrão / Entrada 📱",
          taxaHz: "60 Hz (Padrão do Sistema)",
          respostaToque: "Normal"
        };
      }
    }

    async function gerar(nivel) {
      const inputModeloTxt = document.getElementById('modelo').value.trim();
      const modelo = inputModeloTxt || (os === 'Android' ? 'Android' : 'iPhone');
      const specs = detectarHardware(modelo);

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('resultado').classList.add('hidden');
      await new Promise(r => setTimeout(r, 3500));

      const base = nivel === 'Baixa' ? {g:rand(90,130),pv:rand(130,180),m2:rand(130,170),m4:rand(130,180),awm:rand(30,75),ol:rand(50,90),bt:rand(50,70), dpi:rand(410,520)}
                 : nivel === 'Média' ? {g:rand(120,160),pv:rand(130,170),m2:rand(130,150),m4:rand(130,160),awm:rand(25,35),ol:rand(60,80),bt:rand(50,75), dpi:rand(450,610)}
                 : nivel === 'Alta'  ? {g:rand(130,200),pv:rand(150,200),m2:rand(150,200),m4:rand(150,200),awm:rand(35,45),ol:rand(70,90),bt:rand(51,70), dpi:rand(620,820)}
                                     : {g:rand(170,200),pv:rand(180,200),m2:rand(180,200),m4:rand(180,200),awm:rand(40,80),ol:rand(60,75),bt:rand(35,62), dpi: 'Padrão do Aparelho (Sem DPI)'};

      const config = os === 'Android' ? {
        geral: base.g, pontoVermelho: base.pv, mira2x: base.m2, mira4x: base.m4, miraAWM: base.awm, olhadinha: base.ol, botaoAtirar: base.bt,
        dpi: base.dpi,
        velPonteiro: escolha(['Lenta','Normal','Rápida']),
        fonte: escolha(['Pequena','Padrão','Grande']),
        anim: escolha(['0.5x','1x','Desligada']),
        atraso: escolha(['Curto','Médio','Longo']),
        mouse: escolha(['Ativado','Desativado']),
        permanencia: randFloat(0.1,0.5,1)+'s',
        tempoLeitura: randFloat(0.1,0.4,2)+'s',
        atrasoPrimeiro: randFloat(0.1,0.4,2)+'s',
        numeroLeituras: rand(2,10)+' repetições',
        ignorarToques: randFloat(0.01,0.05,2)+'s',
        destaqueLeitura: escolha(['Linha sólida fina','Linha sólida média','Linha sólida espessa']),
        leituraPontual: randFloat(0.2,0.8,2)+' cm por segundo',
        personalizarGestos: escolha(['Focar no primeiro item','Focar no último item','Rolar para frente']),
        reduzirTitulo: escolha(['Ativado','Desativado']),
        filtrarEventos: escolha(['Ativar todas as opções','Desativar tudo','Filtrar por tipo'])
      } : {
        geral: base.g, pontoVermelho: base.pv, mira2x: base.m2, mira4x: base.m4, miraAWM: base.awm, olhadinha: base.ol, botaoAtirar: base.bt,
        cursor: rand(90,120),
        ciclos: rand(3,10),
        tolerancia: escolha(['Padrão','Alta','Baixa']),
        segundosAdaptado: randFloat(1.5,2.5,2)+'s',
        cursorMovel: escolha(['Preciso','Individual']),
        velocidadeCursor: rand(100,120)
      };

      document.getElementById('resultado').innerHTML = `
        <div class="bg-[#1a1c2c] border border-cyan-400/50 rounded-xl p-8 text-center shadow-lg shadow-cyan-400/10">
          <span class="bg-cyan-400 text-black font-bold text-xs px-3 py-1 rounded-full uppercase tracking-widest">Sensi VIP 2.0</span>
          <h2 class="text-3xl font-bold mt-2 text-cyan-400 uppercase italic">Sensi ${nivel} Gerada!</h2>
          <p class="text-xl text-gray-300 mt-1">${modelo} • ${os}</p>
        </div>

        <!-- ANÁLISE DO HARDWARE DO CELULAR -->
        <div class="bg-[#1a1c2c] border border-gray-700/50 rounded-xl p-6">
          <h3 class="text-xl font-bold text-cyan-400 mb-4 uppercase italic flex items-center gap-2">
            <i class="fas fa-microchip"></i> Análise de Hardware do Celular
          </h3>
          <div class="space-y-3 text-lg">
            <div><span class="text-gray-400">Categoria:</span> <strong>${specs.categoria}</strong></div>
            <div><span class="text-gray-400">Taxa de Atualização:</span> <strong class="text-cyan-400">${specs.taxaHz}</strong></div>
            <div><span class="text-gray-400">Resposta ao Toque:</span> <strong>${specs.respostaToque}</strong></div>
          </div>
        </div>

        <!-- SENSI NO JOGO -->
        <div class="bg-[#1a1c2c] border border-gray-700/50 rounded-xl p-6">
          <h3 class="text-2xl font-bold text-cyan-400 mb-6 uppercase italic flex items-center gap-2">
            <i class="fas fa-crosshairs"></i> Sensi no Jogo (Escala 200)
          </h3>
          <div class="grid grid-cols-2 gap-6 text-xl">
            <div><span class="text-gray-400">Geral:</span> <strong>${config.geral}</strong></div>
            <div><span class="text-gray-400">P. Vermelho:</span> <strong>${config.pontoVermelho}</strong></div>
            <div><span class="text-gray-400">Mira 2x:</span> <strong>${config.mira2x}</strong></div>
            <div><span class="text-gray-400">Mira 4x:</span> <strong>${config.mira4x}</strong></div>
            <div><span class="text-gray-400">Mira AWM:</span> <strong>${config.miraAWM}</strong></div>
            <div><span class="text-gray-400">Olhadinha:</span> <strong>${config.olhadinha}</strong></div>
            <div class="col-span-2"><span class="text-gray-400">Botão de Tiro:</span> <strong>${config.botaoAtirar}%</strong></div>
          </div>

          <!-- BOTÃO COPIAR SENSI -->
          <button onclick="copiarSensibilidade('${config.geral}', '${config.pontoVermelho}', '${config.mira2x}', '${config.mira4x}', '${config.miraAWM}', '${config.olhadinha}', '${config.botaoAtirar}', '${config.dpi}')" class="w-full mt-6 py-3 bg-cyan-400 hover:bg-cyan-500 rounded-lg font-bold text-black transition flex justify-center items-center gap-2">
            <i class="fas fa-copy"></i> <span id="btn-copiar-txt">COPIAR SENSIBILIDADE</span>
          </button>
        </div>

        ${os === 'Android' ? `
          <div class="bg-[#1a1c2c] border border-gray-700/50 rounded-xl p-6">
            <h3 class="text-2xl font-bold text-cyan-400 mb-6 uppercase italic">Ajustes Gerais</h3>
            <div class="grid grid-cols-2 gap-6 text-xl">
              <div><span class="text-gray-400">DPI:</span> <strong>${config.dpi}</strong></div>
              <div><span class="text-gray-400">Vel. Ponteiro:</span> <strong>${config.velPonteiro}</strong></div>
              <div><span class="text-gray-400">Fonte:</span> <strong>${config.fonte}</strong></div>
              <div><span class="text-gray-400">Animações:</span> <strong>${config.anim}</strong></div>
              <div><span class="text-gray-400">Atraso ao Tocar:</span> <strong>${config.atraso}</strong></div>
              <div><span class="text-gray-400">Mouse Grande:</span> <strong>${config.mouse}</strong></div>
              <div><span class="text-gray-400">Permanência:</span> <strong>${config.permanencia}</strong></div>
            </div>
          </div>
          <div class="bg-[#1a1c2c] border border-gray-700/50 rounded-xl p-6">
            <h3 class="text-2xl font-bold text-cyan-400 mb-6 uppercase italic">Acesso com Interruptor</h3>
            <div class="grid grid-cols-2 gap-6 text-xl">
              <div><span class="text-gray-400">T. Leitura Automática:</span> <strong>${config.tempoLeitura}</strong></div>
              <div><span class="text-gray-400">Atraso Primeiro Item:</span> <strong>${config.atrasoPrimeiro}</strong></div>
              <div><span class="text-gray-400">Nº de Leituras:</span> <strong>${config.numeroLeituras}</strong></div>
              <div><span class="text-gray-400">Ignorar Toques:</span> <strong>${config.ignorarToques}</strong></div>
              <div><span class="text-gray-400">Destaque:</span> <strong>${config.destaqueLeitura}</strong></div>
              <div><span class="text-gray-400">Leitura Pontual:</span> <strong>${config.leituraPontual}</strong></div>
            </div>
          </div>
          <div class="bg-[#1a1c2c] border border-gray-700/50 rounded-xl p-6">
            <h3 class="text-2xl font-bold text-cyan-400 mb-6 uppercase italic">Talkback</h3>
            <div class="grid grid-cols-2 gap-6 text-xl">
              <div><span class="text-gray-400">Gestos:</span> <strong>${config.personalizarGestos}</strong></div>
              <div><span class="text-gray-400">Reduzir Atraso:</span> <strong>${config.reduzirTitulo}</strong></div>
              <div><span class="text-gray-400">Reduzir Título:</span> <strong>${config.reduzirTitulo}</strong></div>
              <div><span class="text-gray-400">Filtrar Eventos:</span> <strong>${config.filtrarEventos}</strong></div>
            </div>
          </div>
        ` : `
          <div class="bg-[#1a1c2c] border border-gray-700/50 rounded-xl p-6">
            <h3 class="text-2xl font-bold text-cyan-400 mb-6 uppercase italic">Ajustes iPhone</h3>
            <div class="grid grid-cols-2 gap-4 text-xl">
              <div><span class="text-gray-400">Tamanho Cursor:</span> <strong>${config.cursor}</strong></div>
              <div><span class="text-gray-400">Ciclos:</span> <strong>${config.ciclos}</strong></div>
              <div><span class="text-gray-400">Tolerância:</span> <strong>${config.tolerancia}</strong></div>
              <div><span class="text-gray-400">Toque Adaptado:</span> <strong>${config.segundosAdaptado}</strong></div>
              <div><span class="text-gray-400">Cursor Móvel:</span> <strong>${config.cursorMovel}</strong></div>
              <div><span class="text-gray-400">Velocidade:</span> <strong>${config.velocidadeCursor}</strong></div>
            </div>
          </div>
        `}
      `;

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('resultado').classList.remove('hidden');
      document.getElementById('resultado').scrollIntoView({ behavior: 'smooth' });
    }

    function copiarSensibilidade(g, pv, m2, m4, awm, ol, bt, dpi) {
      const texto = `🔥 SENSI GERADOR VIP 2.0 - CAPITÃO SENSI 🔥\n\n🎯 Geral: ${g}\n🔴 Ponto Vermelho: ${pv}\n🔍 Mira 2x: ${m2}\n🔍 Mira 4x: ${m4}\n🎯 Mira AWM: ${awm}\n👁️ Olhadinha: ${ol}\n🔘 Botão de Tiro: ${bt}%\n📱 DPI: ${dpi}`;
      navigator.clipboard.writeText(texto).then(() => {
        document.getElementById('btn-copiar-txt').innerText = "COPIADO COM SUCESSO!";
        setTimeout(() => {
          document.getElementById('btn-copiar-txt').innerText = "COPIAR SENSIBILIDADE";
        }, 2500);
      });
    }
  </script>
</body>
</html>
